apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - argocd.lab.swipe.lat
  rules:
    - backendRefs:
        # argocd-server must run with server.insecure=true or it
        # redirects HTTP->HTTPS and loops behind the Gateway's TLS.
        - name: argocd-server
          port: 80

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-cache-v2
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  # Renamed from vllm-cache: local-path does not support volume expansion,
  # so an in-place size bump fails the sync. Argo creates this and prunes
  # the old 40Gi PVC. Only a redownloadable HF cache is lost.
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: vllm
          # Qwen3.6 needs vLLM 0.17.0+ (gated delta network attention).
          # Always, not IfNotPresent: the node has a stale cached :latest
          # that will fail with an unknown-architecture error.
          # TODO: read the version from the startup log and pin it here.
          image: vllm/vllm-openai:latest
          imagePullPolicy: Always
          args:
            # 4-bit AWQ. FP8 is ~27GB of weights and needs SM 8.9+;
            # the 3090 is SM 8.6 with 24GB, so neither applies.
            - "--model"
            - "QuantTrio/Qwen3.6-27B-AWQ"
            - "--served-model-name"
            - "Qwen3.6-27B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            # Native context is 262144. Not affordable here -- ~15GB of
            # weights leaves roughly 7GB for KV. Start conservative and
            # raise once the startup log shows available KV blocks.
            - "--max-model-len"
            - "32768"
            - "--gpu-memory-utilization"
            - "0.92"
            - "--enable-prefix-caching"
            # Qwen3.6 parsers. hermes was Qwen2.5-only and would return
            # empty tool_calls with no error on this model.
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--reasoning-parser"
            - "qwen3"
            - "--trust-remote-code"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /cache
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-hf-token
                  key: token
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              nvidia.com/gpu: 1
              # Node has ~32GB total; the old 32Gi limit was the whole box.
              memory: 24Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
            # ~15GB cold download on first boot; 60 x 15s = 15 min.
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 900
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: vllm-cache-v2
        - name: shm
          emptyDir:
            medium: Memory
            # Counts against the pod memory limit above.
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  type: NodePort
  selector:
    app: vllm
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30820
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-cache
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: vllm
          # Confirmed working on this node: v0.26.0 loaded AWQ via
          # MarlinLinearKernel fine. Pin once this boot succeeds.
          image: vllm/vllm-openai:latest
          imagePullPolicy: Always
          args:
            # Verified 12.38 GB of safetensors -> ~9.3 GiB headroom at 0.92.
            # Do not swap this without re-running the HF size check;
            # the vision tower and GDN layers stay fp16, so "4-bit"
            # does not mean what the GGUF tables say it means.
            - "--model"
            - "QuantTrio/Qwen3.5-9B-AWQ"
            - "--served-model-name"
            - "Qwen3.5-9B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            # Conservative first boot. Raise after reading the reported
            # KV cache size in the startup log.
            - "--max-model-len"
            - "32768"
            - "--gpu-memory-utilization"
            - "0.92"
            - "--enable-prefix-caching"
            # Qwen3.5 first-party guidance: qwen3 reasoning, qwen3_coder tools.
            # NOT hermes -- that was Qwen2.5-only.
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--reasoning-parser"
            - "qwen3"
            - "--trust-remote-code"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /cache
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-hf-token
                  key: token
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              nvidia.com/gpu: 1
              memory: 12Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
          # Suspends liveness/readiness until the model is up.
          # 240 x 15s = 60 min for the cold download.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  type: NodePort
  selector:
    app: vllm
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30820
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
# The wildcard cert has to live in the Gateway's namespace.
# This replaces the per-namespace Certificates the Ingress
# approach would have needed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: gateway
spec:
  secretName: lab-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.lab.swipe.lat"
    - "lab.swipe.lat"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.swipe.lat"
      tls:
        certificateRefs:
          - kind: Secret
            name: lab-wildcard-tls
      allowedRoutes:
        # Lets HTTPRoutes in gitea, argocd, etc. attach to this
        # Gateway without a ReferenceGrant each.
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.swipe.lat"
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lab-pool
spec:
  blocks:
    # Must be OUTSIDE the router's DHCP range or you'll get
    # intermittent conflicts.
    - start: "192.168.1.240"
      stop: "192.168.1.250"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2
spec:
  # Interface names differ per node (enp2s0 / eno1 / enp90s0), so the
  # policy must be pinned to a node where the named interface exists.
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: swipe-worker-1
  interfaces:
    - enp2s0
  externalIPs: true
  loadBalancerIPs: true
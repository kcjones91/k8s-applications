apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      # Must be on worker-1: the Gateway's L2 announcement is pinned
      # there, and cross-node forwarding from Envoy currently times out.
      nodeSelector:
        kubernetes.io/hostname: swipe-worker-1
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        ports:
        - containerPort: 3000
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "home.lab.swipe.lat"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        volumeMounts:
        # Writable dir — Homepage does mkdir /app/config/logs at start,
        # which fails on a plain ConfigMap mount (read-only).
        - name: config-dir
          mountPath: /app/config
        # Individual files layered in via subPath so the parent stays writable.
        - name: config-files
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        - name: config-files
          mountPath: /app/config/services.yaml
          subPath: services.yaml
        - name: config-files
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
        - name: config-files
          mountPath: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
      volumes:
      - name: config-dir
        emptyDir: {}
      - name: config-files
        configMap:
          name: homepage-config

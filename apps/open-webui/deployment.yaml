apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  # Required: a ReadWriteOnce PVC cannot be mounted by the new pod while the
  # old one still holds it, so RollingUpdate would deadlock on every sync.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Open WebUI snapshots config into its DB on first boot and then
            # ignores env changes. With a PVC now attached, that would make
            # this manifest cosmetic. Setting this false keeps git authoritative.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"

            # vLLM (OpenAI-compatible). Service listens on port 80 -> 8000.
            - name: OPENAI_API_BASE_URL
              value: http://vllm.vllm.svc.cluster.local/v1
            - name: OPENAI_API_KEY
              value: "sk-noauth"

            # Ollama. Flip ENABLE_OLLAMA_API to "false" if you retire it --
            # if the endpoint is unreachable, startup stalls on connection timeouts.
            - name: ENABLE_OLLAMA_API
              value: "true"
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434

            - name: WEBUI_NAME
              value: "swipe-lab"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - chat.lab.swipe.lat
  rules:
    - backendRefs:
        - name: open-webui
          port: 8080
# Counts "i want this" signups per not_covered platform from the HubSpot interest
# form and writes /data/interest.json for the Threat Watch poll to pick up.
#
# Out-of-band secret (create once, never commit):
#   kubectl -n secbrief create secret generic secbrief-hubspot \
#     --from-literal=HUBSPOT_TOKEN=pat-na1-... \
#     --from-literal=HUBSPOT_FORM_ID=<form guid from the form's Share/Embed panel>
# Private app scopes needed: forms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secbrief-interest-counter
  namespace: secbrief
data:
  count.py: |
    """Tally HubSpot form submissions by the hidden `interest` field. Stdlib only."""
    import json, os, sys, tempfile, urllib.parse, urllib.request

    token = os.environ["HUBSPOT_TOKEN"]
    form_id = os.environ["HUBSPOT_FORM_ID"]
    out = os.environ.get("INTEREST_OUT", "/data/interest.json")
    field = os.environ.get("INTEREST_FIELD", "interest")

    base = f"https://api.hubapi.com/form-integrations/v1/submissions/forms/{form_id}"
    counts, seen, after = {}, set(), None
    while True:
        q = {"limit": 50}
        if after:
            q["after"] = after
        req = urllib.request.Request(base + "?" + urllib.parse.urlencode(q),
                                     headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, timeout=30) as r:
            page = json.load(r)
        for sub in page.get("results", []):
            vals = {v.get("name"): v.get("value") for v in sub.get("values", [])}
            key = (vals.get(field) or "").strip().lower()
            email = (vals.get("email") or "").strip().lower()
            if not key or (key, email) in seen:   # one vote per address per platform
                continue
            seen.add((key, email))
            counts[key] = counts.get(key, 0) + 1
        after = (page.get("paging") or {}).get("next", {}).get("after")
        if not after:
            break

    d = os.path.dirname(out)
    fd, tmp = tempfile.mkstemp(dir=d, prefix=".interest-", suffix=".json")
    with os.fdopen(fd, "w") as f:
        json.dump(counts, f)
    os.chmod(tmp, 0o644)
    os.replace(tmp, out)            # atomic: the poll never reads a half-written file
    print(json.dumps(counts), file=sys.stderr)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secbrief-interest
  namespace: secbrief
spec:
  # hourly at :41; the 30-min poll picks the file up on its next run
  schedule: "41 * * * *"
  suspend: true
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seLinuxOptions: { level: "s0:c100,c200" } }
          containers:
            - name: count
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "-I", "/opt/count.py"]
              env:
                - { name: INTEREST_OUT, value: "/data/interest.json" }
              envFrom:
                - secretRef: { name: secbrief-hubspot }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: script, mountPath: /opt, readOnly: true }
                - { name: data, mountPath: /data }
          volumes:
            - { name: script, configMap: { name: secbrief-interest-counter } }
            - { name: data, persistentVolumeClaim: { claimName: secbrief-data } }

# EE Security Brief (secbrief): CVE ladders, alerts, daily brief.
# Code + image: github.com/kcjones91/ee-secbrief -> ghcr.io/kcjones91/ee-secbrief
# Picked up by bootstrap/applicationset.yaml (apps/*), namespace = secbrief.
#
# Created out of band, never in git:
#   secbrief-secrets    OPENCVE_TOKEN, RESEND_API_KEY
#   secbrief-clients    one YAML per client (--from-file=clients/)
#   ghcr-pull           docker-registry secret for the private GHCR image
#   secbrief-inventory  optional, <client>.json from ansible/gather_inventory.yml
#   cloudflared-threatwatch  TUNNEL_TOKEN for the Cloudflare Tunnel serving threats.engexcellence.co
apiVersion: v1
kind: Namespace
metadata:
  name: secbrief
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secbrief-data
  namespace: secbrief
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secbrief-config
  namespace: secbrief
data:
  config.yaml: |
    sources:
      opencve:
        base_url: https://app.opencve.io/api
        lookback_hours: 48
        max_pages: 10
      redhat:
        base_url: https://access.redhat.com/hydra/rest/securitydata
      kev_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      epss_url: https://api.first.org/data/v1/epss
      poc_url_template: https://raw.githubusercontent.com/nomi-sec/PoC-in-GitHub/master/{year}/{cve}.json
    components:
      kernel:     { vendor: linux,   product: linux_kernel, rpm: kernel }
      openssl:    { vendor: openssl, product: openssl,      rpm: openssl }
      openssh:    { vendor: openbsd, product: openssh,      rpm: openssh-server }
      nginx:      { vendor: f5,      product: nginx,        rpm: nginx }
      containerd: { vendor: linuxfoundation, product: containerd, rpm: containerd }
    os_components:
      rhel-8:  [kernel, openssl, openssh]
      rhel-9:  [kernel, openssl, openssh]
      rhel-10: [kernel, openssl, openssh]
    redhat_products:
      rhel-8:  "Red Hat Enterprise Linux 8"
      rhel-9:  "Red Hat Enterprise Linux 9"
      rhel-10: "Red Hat Enterprise Linux 10"
    public:
      # free Threat Watch page, rendered after every poll into /data/public
      enabled: true
      stacks: [rhel-8, rhel-9, rhel-10]
      software: [nginx, containerd]
      exposure: internet            # worst-case profile for the public view
      multi_tenant_containers: true
      site_url: https://threats.engexcellence.co
      digest_url: https://engexcellence.co/contact
      book_url: https://engexcellence.co/#book
      radar_max: 8
      # Platforms we get asked about but do not track. Muted chip + honest "not covered
      # yet, want it?" panel with a signup form. Never matched, scored or laddered.
      not_covered:
        - id: windows
          label: Windows Server
          blurb: >-
            We only publish what we follow closely enough to call a quiet day with
            confidence. If Windows Server coverage would change whether you use this
            page, say so below. Enough hands up and we build it, with the same rules
            and ladders.
          vendor_url: https://msrc.microsoft.com/update-guide
          vendor_name: Microsoft Security Response Center
      # form target for "i want this" (hidden field interest=<id>); empty = digest_url
      interest_url: https://engexcellence.co/contact
      # {"windows": 12} written by the signup counter; at or above the threshold the
      # panel adds "others have asked for this". The count itself is never shown.
      interest_file: ""        # or env SECBRIEF_INTEREST_FILE
      interest_threshold: 10
      # HubSpot form the panel posts to directly (public submission API, no auth). Public ids only.
      hubspot:
        portal_id: "247447050"
        form_id: "39287be1-b479-4b36-85a9-461b34eb011f"
        region: na2
        api_host: ""           # override only if submits 404 on api.hsforms.com
    scoring:
      critical_cvss: 9.0
      watch_cvss: 7.0
      watch_epss: 0.10
      fix_grace_days: 14   # watchlist tiers: a released patch this old counts as resolved
      stale_days: 365      
    llm:
      base_url: http://vllm.vllm.svc.cluster.local/v1
      model: Qwen3.5-9B
      timeout_s: 90
    email:
      from: "EE Security Brief <security@engexcellence.co>"
      subject_prefix: "Security Brief"
  overrides.yaml: |
    # Analyst-set facts. Can only RAISE a rung. Always cite a source.
    {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secbrief-poll
  namespace: secbrief
spec:
  schedule: "*/30 * * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels: { app: secbrief-poll }
        spec:
          restartPolicy: Never
          # private GHCR package: ghcr-pull is created out of band in this namespace
          imagePullSecrets:
            - name: ghcr-pull
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seLinuxOptions: { level: "s0:c100,c200" } }
          containers:
            - name: poll
              image: ghcr.io/kcjones91/ee-secbrief:v0.6.0   # pin a tag in GitOps
              imagePullPolicy: IfNotPresent
              args: ["poll"]
              env:
                # in-cluster route to the vllm Service (namespace vllm, port 80)
                - { name: VLLM_BASE_URL, value: "http://vllm.vllm.svc.cluster.local/v1" }
                - { name: VLLM_MODEL, value: "Qwen3.5-9B" }   # must match --served-model-name
                # "off" seeds state without paging anyone; flip to "on" after the first poll
                - { name: SECBRIEF_ALERTS, value: "on" }
                # re-render the free Threat Watch page after each poll (served by threatwatch below)
                - { name: SECBRIEF_PUBLIC_OUT, value: "/data/public" }
                # signup counts for not_covered platforms; outside /data/public so nginx never serves it
                - { name: SECBRIEF_INTEREST_FILE, value: "/data/interest.json" }
              envFrom:
                - secretRef: { name: secbrief-secrets }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 384Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: config, mountPath: /etc/secbrief/config, readOnly: true }
                - { name: clients, mountPath: /etc/secbrief/clients, readOnly: true }
                - { name: inventory, mountPath: /etc/secbrief/inventory, readOnly: true }
                - { name: data, mountPath: /data }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: config, configMap: { name: secbrief-config } }
            - { name: clients, secret: { secretName: secbrief-clients } }
            - { name: inventory, secret: { secretName: secbrief-inventory, optional: true } }
            - { name: data, persistentVolumeClaim: { claimName: secbrief-data } }
            - { name: tmp, emptyDir: {} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secbrief-digest
  namespace: secbrief
spec:
  # 07:12 America/Chicago; timeZone pins it across DST
  schedule: "12 7 * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels: { app: secbrief-digest }
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seLinuxOptions: { level: "s0:c100,c200" } }
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: digest
              image: ghcr.io/kcjones91/ee-secbrief:v0.6.0   # pin a tag in GitOps
              imagePullPolicy: IfNotPresent
              args: ["digest"]
              env:
                - { name: VLLM_BASE_URL, value: "http://vllm.vllm.svc.cluster.local/v1" }
                - { name: VLLM_MODEL, value: "Qwen3.5-9B" }
              envFrom:
                - secretRef: { name: secbrief-secrets }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 384Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: config, mountPath: /etc/secbrief/config, readOnly: true }
                - { name: clients, mountPath: /etc/secbrief/clients, readOnly: true }
                - { name: data, mountPath: /data }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: config, configMap: { name: secbrief-config } }
            - { name: clients, secret: { secretName: secbrief-clients } }
            - { name: data, persistentVolumeClaim: { claimName: secbrief-data } }
            - { name: tmp, emptyDir: {} }
---
# ---- Free Threat Watch: static page from the PVC, published via Cloudflare Tunnel ----
apiVersion: v1
kind: ConfigMap
metadata:
  name: threatwatch-nginx
  namespace: secbrief
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      # only the rendered page dir; the SQLite DB in /data is never reachable
      root /data/public;
      index index.html;
      server_tokens off;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location ~ /\. { deny all; }          # temp files from atomic writes
      location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatwatch
  namespace: secbrief
spec:
  replicas: 1
  selector:
    matchLabels: { app: threatwatch }
  template:
    metadata:
      labels: { app: threatwatch }
    spec:
      # local-path PV pins this to the same node as the CronJobs (swipe-worker-3).
      # Same SELinux level as the CronJobs: worker-3 enforces SELinux, and pods with
      # different MCS categories can't read each other's files on the shared PVC.
      securityContext: { runAsNonRoot: true, runAsUser: 101, fsGroup: 10001, seLinuxOptions: { level: "s0:c100,c200" } }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: secbrief-data, readOnly: true } }
        - { name: conf, configMap: { name: threatwatch-nginx } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: threatwatch
  namespace: secbrief
spec:
  selector: { app: threatwatch }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Remotely-managed tunnel: the public hostname threats.engexcellence.co ->
# http://threatwatch.secbrief.svc.cluster.local is configured in the Cloudflare dashboard.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-threatwatch
  namespace: secbrief
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared-threatwatch }
  template:
    metadata:
      labels: { app: cloudflared-threatwatch }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: cloudflared-threatwatch } }
      containers:
        - name: cloudflared
          # pinned; bump from github.com/cloudflare/cloudflared/releases
          image: cloudflare/cloudflared:2026.10.7
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-threatwatch, key: TUNNEL_TOKEN } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
